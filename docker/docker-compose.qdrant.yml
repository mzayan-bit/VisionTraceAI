
# ============================================================
# VisionTraceAI — Qdrant Vector Database
# ============================================================
# Start:   docker compose -f docker/docker-compose.qdrant.yml up -d
# Stop:    docker compose -f docker/docker-compose.qdrant.yml down
# Logs:    docker compose -f docker/docker-compose.qdrant.yml logs -f
# Reset:   docker compose -f docker/docker-compose.qdrant.yml down -v
# ============================================================

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: visiontrace-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"     # HTTP API
      - "6334:6334"     # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  qdrant_data:
    driver: local
