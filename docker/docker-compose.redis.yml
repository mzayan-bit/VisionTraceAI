# ============================================================
# VisionTraceAI — Redis (Temporal Trajectory Store)
# ============================================================
# Start:   docker compose -f docker/docker-compose.redis.yml up -d
# Stop:    docker compose -f docker/docker-compose.redis.yml down
# Logs:    docker compose -f docker/docker-compose.redis.yml logs -f
# Reset:   docker compose -f docker/docker-compose.redis.yml down -v
# CLI:     docker exec -it visiontrace-redis redis-cli
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: visiontrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  redis_data:
    driver: local
