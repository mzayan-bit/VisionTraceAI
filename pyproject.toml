[project]
name = "visiontrace-ai"
version = "0.1.0"
description = "Production-grade AI-powered surveillance system with real-time video analytics, object detection, tracking, and anomaly detection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "VisionTraceAI Team" },
]
keywords = [
    "ai",
    "surveillance",
    "computer-vision",
    "object-detection",
    "tracking",
    "anomaly-detection",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "lapx>=0.9.4",
    "opencv-python>=4.13.0.92",
    "pydantic-settings>=2.14.1",
    "qdrant-client>=1.18.0",
    "ultralytics>=8.4.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/mzayan-bit/VisionTraceAI"
Repository = "https://github.com/mzayan-bit/VisionTraceAI"
Issues = "https://github.com/mzayan-bit/VisionTraceAI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
